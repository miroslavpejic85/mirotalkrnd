services:
    mirotalkrnd:
        image: mirotalk/rnd:latest
        container_name: mirotalkrnd
        hostname: mirotalkrnd
        # Run as non-root (uid:gid). The image already defaults to the non-root
        # "node" user (1000:1000); set this to override with a different uid/gid.
        user: '1000:1000'
        restart: unless-stopped
        ports:
            - '${PORT:-4010}:${PORT:-4010}'
        volumes:
            - .env:/src/.env:ro
            # Optional volumes for real-time updates:
            # - ./public/:/src/public/:ro
            # - ./src/:/src/src/:ro
            # - ./server.js:/src/server.js
